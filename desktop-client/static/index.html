<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b16">
<title>局域网互传</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/static/favicon-32.png" sizes="32x32" type="image/png">
<link rel="shortcut icon" href="/static/favicon.ico">
<link rel="apple-touch-icon" href="/static/logo-192.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="bgLayer" class="bg-layer" aria-hidden="true"></div>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <img class="logo" src="/static/logo-96.png" alt="文件传输" width="42" height="42">
      <div>
        <h1>局域网互传</h1>
        <p class="sub" id="deviceInfo">正在连接…</p>
      </div>
    </div>
    <div class="top-actions">
      <button id="bgBtn" class="icon-btn" title="更换背景" aria-label="更换背景">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.8"/><path d="m20.5 15.5-4.2-4.2L4 21"/>
        </svg>
      </button>
      <button id="refreshBtn" class="icon-btn" title="刷新列表" aria-label="刷新列表">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/>
        </svg>
      </button>
    </div>
  </header>

  <section class="hero">
    <div id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="选择文件上传">
      <div class="dz-icon">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 16V4"/><path d="M7.5 8.5 12 4l4.5 4.5"/><path d="M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13A1.5 1.5 0 0 0 20 18.5V15"/>
        </svg>
      </div>
      <h2>发送文件到这台设备</h2>
      <p>点击选择文件，或把文件拖到这里</p>
      <span class="primary">选择文件</span>
      <input type="file" id="fileInput" multiple hidden>
    </div>
    <p class="hint">手机与电脑连接同一个 Wi-Fi · 数据仅在局域网内直传，不经过外网</p>
  </section>

  <section class="uploads" id="uploadPanel" hidden>
    <div class="section-head">
      <h2>正在传输</h2>
    </div>
    <div id="uploadList" class="upload-list"></div>
  </section>

  <section class="files">
    <div class="section-head">
      <h2>可下载文件 <span class="count" id="fileCount">0</span></h2>
      <div class="head-tools">
        <select id="spaceSelect" class="space-select" aria-label="选择空间" title="选择空间"></select>
        <input id="search" class="search" type="search" placeholder="搜索文件" autocomplete="off">
      </div>
    </div>
    <div id="fileList" class="file-list"></div>
    <div id="emptyState" class="empty">
      <div class="empty-icon">
        <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>
        </svg>
      </div>
      <p>还没有文件</p>
      <span>上传的文件会出现在这里，供所有设备下载</span>
    </div>
  </section>

  <section class="card connect" id="connectCard" hidden>
    <div class="connect-head">
      <div>
        <h2>手机扫码直连</h2>
        <p class="share-url" id="shareUrl">—</p>
      </div>
      <button id="toggleQr" class="ghost" type="button">展开</button>
    </div>
    <div class="qr-wrap" id="qrWrap" hidden>
      <div class="qr-box" id="qr"></div>
      <div class="qr-side">
        <p>用手机相机或浏览器扫码，<br>即可打开同一个互传页面。</p>
        <button id="copyBtn" class="ghost" type="button">复制链接</button>
      </div>
    </div>
  </section>

  <footer>
    <span id="storageInfo">保存目录加载中…</span>
  </footer>
</div>

<section class="sheet" id="bgSheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="bgTitle">
    <h2 id="bgTitle">外观 · 背景</h2>
    <p class="sheet-sub">背景只保存在本机浏览器里，不会上传；换设备或清缓存后恢复默认。</p>
    <p class="sheet-file" id="bgFileName">当前：默认背景</p>
    <div class="sheet-row">
      <button class="primary" id="bgPick" type="button">选择图片…</button>
      <button class="ghost" id="bgReset" type="button">恢复默认背景</button>
      <input type="file" id="bgInput" accept="image/jpeg,image/png,image/webp,image/bmp" hidden>
    </div>
    <label class="sheet-label" for="bgMode">显示方式</label>
    <select id="bgMode" class="sheet-select">
      <option value="fill">铺满（等比裁切填满）</option>
      <option value="fit">适应（完整显示）</option>
      <option value="tile">平铺（重复排列）</option>
      <option value="center">居中（原始大小）</option>
    </select>
    <label class="sheet-label" for="bgDim">遮罩浓度 <span id="bgDimVal">45%</span></label>
    <input type="range" id="bgDim" min="0" max="100" step="5" value="45">
    <p class="sheet-tip">浓度越高背景越暗、文字越清楚；0% 显示原图。</p>
    <div class="sheet-foot">
      <button class="ghost" id="bgClose" type="button">关闭</button>
    </div>
  </div>
</section>

<div id="toast" class="toast"></div>

<script src="/static/qrcode.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
